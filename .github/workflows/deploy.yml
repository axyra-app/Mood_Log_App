name: Production build validation (no deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24.x'

jobs:
  # ========================================
  # Build-only validation. Vercel deployment is configured separately.
  # ========================================
  build:
    name: Build application
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔨 Build application
        run: |
          cd frontend
          npm run build
        env:
          # This workflow validates compilation only. Production Firebase values
          # are provided by Vercel and must never be embedded in a GitHub artifact.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
          VITE_FIREBASE_PROJECT_ID: demo-mood-log-ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci-placeholder'
          VITE_AI_FEATURES_ENABLED: 'false'

      - name: ✅ Build successful
        run: echo "Build validation completed. This workflow did not deploy the application."
