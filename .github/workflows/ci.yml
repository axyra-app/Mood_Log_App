name: CI/CD Pipeline

on:
  push:
    branches: [main, DEV, test]
  pull_request:
    branches: [main]

jobs:
  test:
    # Select the Ubuntu 24.04 image family. Its software inventory can still change;
    # the explicit Android SDK preflight below guards the Wear OS build prerequisites.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Test Firestore security rules
        run: |
          cd frontend
          npm run test:rules

      - name: Test Firebase Admin configuration parsing
        run: |
          cd frontend
          npm run test:api

      - name: Test Firebase index configuration
        run: |
          cd frontend
          npm run test:config

      - name: Test mood metrics
        run: |
          cd frontend
          npm run test:unit

      - name: Typecheck application
        run: |
          cd frontend
          npm run typecheck

      - name: Audit all dependencies
        run: |
          cd frontend
          npm audit

      - name: Build application
        run: |
          cd frontend
          npm run build
        # CI validates compilation only; never bake production Firebase config into its artifact.
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
          VITE_FIREBASE_PROJECT_ID: demo-mood-log-ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci-placeholder'

      - name: Verify Android SDK packages for Wear OS
        run: |
          : "${ANDROID_HOME:?GitHub runner must provide ANDROID_HOME}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || {
            echo "Missing Android SDK Platform 36 in the GitHub runner image." >&2
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt" || {
            echo "Missing Android Build Tools 36.0.0 in the GitHub runner image." >&2
            exit 1
          }
          test -x "$ANDROID_HOME/platform-tools/adb" || {
            echo "Missing Android Platform-Tools (adb) in the GitHub runner image." >&2
            exit 1
          }

      - name: Build Wear OS prototype
        working-directory: wearos
        run: |
          chmod +x ./gradlew
          mkdir -p /tmp/moodlog-wear-core-check
          javac -d /tmp/moodlog-wear-core-check \
            app/src/main/java/app/moodlog/wear/HeartRateSampleSelector.java \
            app/src/main/java/app/moodlog/wear/HeartRatePermissionSelector.java \
            core-tests/HeartRateSampleSelectorSmokeTest.java
          java -cp /tmp/moodlog-wear-core-check app.moodlog.wear.HeartRateSampleSelectorSmokeTest
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ci-validation-build-not-for-deployment
          path: |
            frontend/dist/
            wearos/app/build/outputs/apk/debug/app-debug.apk
